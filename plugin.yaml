# OWASP CRS Plugin Descriptor
# https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "xenforo-rule-exclusions-plugin"
  description: "CRS rule exclusions for XenForo forum software"
  long_description: |
    Provides targeted rule exclusions to eliminate false positives when
    running OWASP CRS in front of XenForo, a PHP-based internet forum
    software package. Covers the XenForo front-end (posts, threads,
    conversations, search, attachments), account management, and the
    admin back-end.
  type: "official"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/xenforo-rule-exclusions-plugin"
  keywords:
    - "xenforo"
    - "forum"
    - "rule-exclusion"
    - "false-positive"

rule_id_range:
  start: 9511000
  end: 9511999

compatibility:
  crs_version: ">=4.0.0"

configuration:
  file: "plugins/xenforo-rule-exclusions-config.conf"
  variables:
    - name: "tx.xenforo-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable XenForo rule exclusions (0 to disable)"
